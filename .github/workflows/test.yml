name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: pandoc を入れる
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install pandoc
          else
            sudo apt-get update && sudo apt-get install -y pandoc
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: CLI
        run: bash test/cli.sh

      - name: ブラウザ側のスクリプト
        run: npx vitest run
