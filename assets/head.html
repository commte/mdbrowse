<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 780px; margin: 0 auto; padding: 40px 24px 120px;
    font: 16px/1.85 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #1f2328; background: #fff;
  }
  h1, h2, h3, h4 { line-height: 1.4; margin: 2em 0 .6em; font-weight: 600; }
  h1 { font-size: 1.9em; } h2 { font-size: 1.45em; } h3 { font-size: 1.2em; }
  h1, h2 { border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
  a { color: #0969da; }
  code { font: .88em/1.6 "SF Mono", Menlo, monospace; background: #eff1f3; padding: .15em .35em; border-radius: 4px; }
  pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 1em 0; padding: .2em 1em; color: #59636e; border-left: 3px solid #d8dee4; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid #d8dee4; padding: 8px 12px; text-align: left; }
  th { background: #f6f8fa; }
  img { max-width: 100%; }
  hr { border: none; border-top: 1px solid #d8dee4; margin: 2em 0; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    h1, h2, hr, th, td { border-color: #30363d; }
    a { color: #4493f8; }
    code { background: #21262d; }
    pre { background: #161b22; }
    th { background: #161b22; }
    blockquote { color: #9198a1; border-left-color: #30363d; }
  }
</style>
<script>
  // 別のファイルで再生成されたら拾うためのポーリング。スクロール位置は保つ
  addEventListener('load', () => { const y = sessionStorage.getItem('mdY'); if (y) scrollTo(0, +y); });
  addEventListener('scroll', () => sessionStorage.setItem('mdY', scrollY));
  setInterval(() => location.reload(), 1000);
</script>
