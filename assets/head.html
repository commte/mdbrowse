<style>
  /* ==== 設定 ===========================================================
     ここが既定値。ブラウザ右上のバーで変えた分は、その人のブラウザに保存されて
     この既定値を上書きする。色は Tailwind CSS の slate パレット
     50 #f8fafc / 100 #f1f5f9 / 200 #e2e8f0 / 300 #cbd5e1 / 400 #94a3b8
     500 #64748b / 600 #475569 / 700 #334155 / 800 #1e293b / 900 #0f172a
     ==================================================================== */
  :root {
    color-scheme: light;

    /* レイアウト */
    --content-width: 780px;
    --font-size: 16px;
    --line-height: 1.85;
    --font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --code-font-family: "SF Mono", Menlo, monospace;

    /* 色（ライト） */
    --bg: #f8fafc;        /* slate-50  */
    --surface: #f1f5f9;   /* slate-100 */
    --border: #e2e8f0;    /* slate-200 */
    --fg: #1e293b;        /* slate-800 */
    --muted: #64748b;     /* slate-500 */
    --link: #2563eb;      /* blue-600  */
  }

  /* 色（ダーク）。バーで dark を選んだとき、および auto + OS がダークのとき */
  :root[data-theme="dark"],
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #0f172a;        /* slate-900 */
    --surface: #1e293b;   /* slate-800 */
    --border: #334155;    /* slate-700 */
    --fg: #e2e8f0;        /* slate-200 */
    --muted: #94a3b8;     /* slate-400 */
    --link: #60a5fa;      /* blue-400  */
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] {
      color-scheme: light;
      --bg: #f8fafc; --surface: #f1f5f9; --border: #e2e8f0;
      --fg: #1e293b; --muted: #64748b; --link: #2563eb;
    }
  }

  /* ==== ここから下は組み方 ============================================ */
  html { background: var(--bg); }
  body {
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 40px 24px 120px;
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-family: var(--font-family);
    color: var(--fg);
    background: var(--bg);
  }
  h1, h2, h3, h4 { line-height: 1.4; font-weight: 600; }
  h1 { font-size: 1.9em; margin: 0 0 1.2em; }
  h2 { font-size: 1.45em; margin: 2.6em 0 .8em; }
  h3 { font-size: 1.2em; margin: 2.2em 0 .6em; }
  h4 { margin: 2em 0 .6em; }
  a { color: var(--link); }
  code {
    font-family: var(--code-font-family); font-size: .88em; line-height: 1.6;
    background: var(--surface); padding: .15em .35em; border-radius: 4px;
  }
  pre { background: var(--surface); padding: 16px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 1em 0; padding: .2em 1em; color: var(--muted); border-left: 3px solid var(--border); }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: var(--surface); }
  img { max-width: 100%; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  ul, ol { padding-left: 1.4em; }
  li { margin: .3em 0; }
  li input[type="checkbox"] { margin-right: .4em; }

  /* ==== 右上のバー ==================================================== */
  #mdbar {
    position: fixed; top: 14px; right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 2px;
    padding: 5px; border-radius: 12px;
    background: var(--surface); color: var(--muted);
    font: 12px/1 var(--font-family);
    opacity: .3; transition: opacity .15s;
  }
  #mdbar:hover, #mdbar:focus-within { opacity: 1; }
  #mdbar button {
    all: unset; cursor: pointer; user-select: none;
    padding: 6px 9px; border-radius: 8px; color: var(--fg);
    font: inherit; min-width: 1.6em; text-align: center;
  }
  #mdbar button:hover { background: var(--bg); }
  @media print { #mdbar { display: none; } }
</style>
<script>
  // 保存済みの設定を body 描画前に当てる（再読み込み時のちらつき防止）
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem('mdPreview') || '{}'); } catch (e) {}
    var r = document.documentElement;
    r.dataset.theme = s.theme || 'light';
    if (s.fontSize) r.style.setProperty('--font-size', s.fontSize + 'px');
    if (s.width) r.style.setProperty('--content-width', s.width + 'px');
    window.__mdSettings = s;
  })();

  addEventListener('DOMContentLoaded', function () {
    var r = document.documentElement;
    var s = window.__mdSettings || {};
    var THEMES = ['light', 'dark', 'auto'];
    var WIDTHS = [640, 780, 960, 1200];
    var paused = false;

    function save() { try { localStorage.setItem('mdPreview', JSON.stringify(s)); } catch (e) {} }
    function fontSize() { return s.fontSize || parseInt(getComputedStyle(r).getPropertyValue('--font-size')) || 16; }

    var bar = document.createElement('div');
    bar.id = 'mdbar';
    bar.innerHTML =
      '<button data-act="theme" title="テーマ"></button>' +
      '<button data-act="dec" title="文字を小さく">A-</button>' +
      '<button data-act="inc" title="文字を大きく">A+</button>' +
      '<button data-act="width" title="本文の幅">&#8596;</button>';

    function render() { bar.querySelector('[data-act=theme]').textContent = s.theme || 'light'; }

    bar.addEventListener('click', function (e) {
      var act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      if (act === 'theme') {
        s.theme = THEMES[(THEMES.indexOf(s.theme || 'light') + 1) % THEMES.length];
        r.dataset.theme = s.theme;
      } else if (act === 'inc' || act === 'dec') {
        s.fontSize = Math.min(24, Math.max(12, fontSize() + (act === 'inc' ? 1 : -1)));
        r.style.setProperty('--font-size', s.fontSize + 'px');
      } else if (act === 'width') {
        var i = WIDTHS.indexOf(s.width || 780);
        s.width = WIDTHS[(i + 1) % WIDTHS.length];
        r.style.setProperty('--content-width', s.width + 'px');
      }
      save(); render();
    });

    // バーを操作している間は再読み込みを止める
    bar.addEventListener('pointerenter', function () { paused = true; });
    bar.addEventListener('pointerleave', function () { paused = false; });

    document.body.appendChild(bar);
    render();

    // スクロール位置の復元
    var y = sessionStorage.getItem('mdY');
    if (y) scrollTo(0, +y);
    addEventListener('scroll', function () { sessionStorage.setItem('mdY', scrollY); });

    // 別のファイルで再生成されたら拾うためのポーリング
    setInterval(function () { if (!paused) location.reload(); }, 1000);
  });
</script>
